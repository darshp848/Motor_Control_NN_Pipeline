[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aedt-mcp"
version = "0.1.0"
description = "MCP server exposing Ansys AEDT (HFSS + Maxwell 3D) via PyAnsys for motor FEM + NN data generation."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [{ name = "Darsh" }]
keywords = ["Ansys", "AEDT", "Maxwell", "HFSS", "MCP", "PyAEDT", "motor", "FEM"]

dependencies = [
    "mcp>=1.2.0",
    "pyaedt[all]>=1.0.0",
    "pydantic>=2.5",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.0",
]
no-lgpl = [
    "mcp>=1.2.0",
    "pyaedt>=1.0.0",
    "pydantic>=2.5",
    "numpy>=1.26",
]

[project.scripts]
aedt-mcp = "aedt_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["out", ".venv", "scripts/generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
disable_error_code = ["attr-defined", "call-arg", "union-attr"]
exclude = ["out/", ".venv/", "tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
